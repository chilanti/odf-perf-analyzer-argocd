---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  selector:
    app: opensearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      serviceAccountName: opensearch
      initContainers:
      - name: fix-permissions
        image: registry.redhat.io/ubi9/ubi-minimal:latest
        command:
        - sh
        - -c
        - |
          chown -R 1000:1000 /usr/share/opensearch/data
          chmod -R 775 /usr/share/opensearch/data
        volumeMounts:
        - name: data
          mountPath: /usr/share/opensearch/data
        securityContext:
          runAsUser: 0
      containers:
      - name: opensearch
        image: public.ecr.aws/opensearchproject/opensearch:2.11.1
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        env:
        - name: discovery.type
          value: single-node
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: DISABLE_SECURITY_PLUGIN
          value: "true"
        resources:
          requests:
            memory: 2Gi
            cpu: 1
          limits:
            memory: 4Gi
            cpu: 2
        volumeMounts:
        - name: data
          mountPath: /usr/share/opensearch/data
        securityContext:
          runAsUser: 1000
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: placeholder-storage-class  # patched per overlay
      resources:
        requests:
          storage: 10Gi
