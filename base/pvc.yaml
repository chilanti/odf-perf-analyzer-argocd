apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: perf-results-pvc
  annotations:
    # Prevent ArgoCD from deleting this PVC when pruning — protects uploaded test results
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: placeholder-storage-class  # patched per overlay
  resources:
    requests:
      storage: 10Gi
